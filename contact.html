<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Hassan Alizadeh for design, art direction, and photography.">
  <title>Contact — Hassan Alizadeh</title>
  <link rel="stylesheet" href="./css/contact.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="contact-shell">
    <header>
      <a class="home-link" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
        Hassan Alizadeh
      </a>
    </header>

    <main class="contact-layout">
      <section class="contact-intro" aria-labelledby="contact-title">
        <h1 id="contact-title">Bring a spark.<br><span>Let’s make it real.</span></h1>
        <p class="intro-copy">I love turning a what-if into something you can see, feel, and remember. Tell me what you’re imagining.</p>
        <nav class="contact-links" aria-label="Connect with Hassan">
          <a href="mailto:hassanalizadeh91@gmail.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
            <span>hassanalizadeh91@gmail.com</span>
          </a>
          <a href="https://www.linkedin.com/in/hassanalizadeh91" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.85H15.8V14.1c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46v4.73H9.51V9.2h2.83v1.31h.04c.39-.74 1.36-1.52 2.8-1.52 3 0 3.57 1.97 3.57 4.53v5.23Z"/></svg>
            <span>LinkedIn</span>
            <span class="external-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </section>

      <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" aria-label="Send a message">
        <input type="hidden" name="form-name" value="contact">
        <p hidden><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" type="text" name="name" autocomplete="name" placeholder="Full name" required>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <fieldset class="topics">
          <legend>What’s it about? <span>Select any</span></legend>
          <div class="topic-options">
            <label><input type="checkbox" name="role[]" value="Design"><span>Design</span></label>
            <label><input type="checkbox" name="role[]" value="Photography"><span>Photography</span></label>
            <label><input type="checkbox" name="role[]" value="Other"><span>Other</span></label>
          </div>
        </fieldset>
        <div class="field">
          <label for="message">Your message</label>
          <textarea id="message" name="message" rows="4" placeholder="A little about your project…" required></textarea>
        </div>
        <button type="submit">Send message <span aria-hidden="true">↗</span></button>
      </form>
    </main>
  </div>
</body>

</html>
